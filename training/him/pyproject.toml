[project]
name = "him-python-pytorch-runtime"
version = "0.1.0"
requires-python = "==3.13.14"
dependencies = [
    "torch==2.14.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
