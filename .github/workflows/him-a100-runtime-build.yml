name: HIM A100 Runtime Image Build

on:
  workflow_dispatch:

concurrency:
  group: him-a100-runtime-v1-corrected-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/logfather/him-a100-reference-runtime
  CONTENT_TAG: def-337db7b29475
  EXPECTED_RUNTIME_DEFINITION_DIGEST: 337db7b29475d7830fc824fd30638c005edd90dd0a56bc3e1fbfa74596b0508d
  EXPECTED_BUILD_CONTEXT_DIGEST: 8b74ce98c234ee4918db58178f14074b601e85f581a2866e07635e4407b48f9a
  EXPECTED_PYTHON_VERSION: 3.13.14
  EXPECTED_TORCH_VERSION: 2.14.0+cu130
  EXPECTED_TORCH_CUDA_BUILD: "13.0"

jobs:
  build-publish-validate:
    name: Build, publish and re-pull HIM A100 runtime
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify source and dependency authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git branch --show-current)" = ""
          test "$(python3 -c 'import json; print(json.load(open("training/him/runtime/a100/runtime-identity.json"))["runtimeImageId"])')" = "HIM_A100_REFERENCE_TRAINING_RUNTIME_IMAGE_V1"
          grep -nE 'pytorch-cu130|torch==2\.14\.0|requires-python = "==3\.13\.14"' training/him/pyproject.toml
          grep -nE '2\.14\.0\+cu130|download-r2\.pytorch\.org/whl/cu130' training/him/uv.lock

      - name: Run focused runtime tests and static gates
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover \
            -s training/him/runtime/a100/tests -p 'test_*.py' -v
          bash -n \
            training/him/runtime/a100/start.sh \
            training/him/runtime/a100/build-context.sh \
            training/him/runtime/a100/runtime-identity.sh \
            training/him/runtime/a100/runtime-image-definition.digest.sh \
            training/him/runtime/a100/build-runtime-rootfs.sh
          if grep -nE \
            '(RUNPOD_API_KEY|OPENAI_API_KEY|HIM_REGISTRY_[A-Z_]+)[[:space:]]*=|github_pat_[A-Za-z0-9]|ghp_[A-Za-z0-9]|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' \
            training/him/runtime/a100; then
            echo 'credential value pattern found' >&2
            exit 78
          fi
          git diff --exit-code -- training/him/pyproject.toml training/him/uv.lock

      - name: Generate bounded build context and verify authority
        id: authority
        shell: bash
        run: |
          set -Eeuo pipefail
          context_dir="$RUNNER_TEMP/him-a100-build-context"
          test ! -e "$context_dir"
          bash training/him/runtime/a100/build-context.sh "$context_dir" > "$RUNNER_TEMP/build-context-output.txt"
          definition_digest=$(bash training/him/runtime/a100/runtime-identity.sh --definition-digest)
          context_digest=$(bash training/him/runtime/a100/runtime-identity.sh --build-context-digest)
          definition_digest_again=$(bash training/him/runtime/a100/runtime-identity.sh --definition-digest)
          context_digest_again=$(bash training/him/runtime/a100/runtime-identity.sh --build-context-digest)
          identity_definition=$(python3 -c 'import json; print(json.load(open("training/him/runtime/a100/runtime-identity.json"))["runtimeImageDefinitionDigest"])')
          identity_context=$(python3 -c 'import json; print(json.load(open("training/him/runtime/a100/runtime-identity.json"))["buildContextDigest"])')
          identity_tag=$(python3 -c 'import json; print(json.load(open("training/him/runtime/a100/runtime-identity.json"))["contentDerivedDeploymentTag"])')
          test "$definition_digest" = "$EXPECTED_RUNTIME_DEFINITION_DIGEST"
          test "$context_digest" = "$EXPECTED_BUILD_CONTEXT_DIGEST"
          test "$definition_digest" = "$definition_digest_again"
          test "$context_digest" = "$context_digest_again"
          test "$identity_definition" = "$EXPECTED_RUNTIME_DEFINITION_DIGEST"
          test "$identity_context" = "$EXPECTED_BUILD_CONTEXT_DIGEST"
          test "$identity_tag" = "$CONTENT_TAG"
          test "$(awk -F '\t' 'NR > 1 && NF { count++ } END { print count + 0 }' training/him/runtime/a100/build-context.manifest.tsv)" = "10"
          {
            echo "context=$context_dir"
            echo "definition_digest=$definition_digest"
            echo "context_digest=$context_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build exact linux/amd64 OCI image
        shell: bash
        env:
          CONTEXT_DIR: ${{ steps.authority.outputs.context }}
        run: |
          set -Eeuo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --file "$CONTEXT_DIR/Dockerfile" \
            --tag "$IMAGE:$CONTENT_TAG" \
            --load \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            "$CONTEXT_DIR"
          local_digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/build-metadata.json")
          test -n "$local_digest"
          test "$local_digest" != "sha256:0bf7b043bdb8b7b17584e29308c701e7162161a694193f33fe3145e325f668f7"
          echo "local_digest=$local_digest" >> "$GITHUB_OUTPUT"

      - name: Validate built runtime before publication
        shell: bash
        run: |
          set -Eeuo pipefail
          python_version=$(docker run --rm --entrypoint /opt/him/runtime/bin/python "$IMAGE:$CONTENT_TAG" --version)
          test "$python_version" = "Python $EXPECTED_PYTHON_VERSION"
          torch_info=$(docker run --rm --entrypoint /opt/him/runtime/bin/python "$IMAGE:$CONTENT_TAG" \
            -c 'import torch; print(torch.__version__); print(torch.version.cuda)')
          test "$torch_info" = $'2.14.0+cu130\n13.0'
          docker run --rm --entrypoint /opt/him/runtime/bin/python "$IMAGE:$CONTENT_TAG" \
            /opt/him/validation/him_runtime_validation_v1.py --mode build
          docker run --rm --entrypoint /bin/bash "$IMAGE:$CONTENT_TAG" -ceu '
            test -d /opt/him/python
            test -d /opt/him/runtime
            test -x /opt/him/runtime/bin/python
            test -d /opt/him/runtime/lib/python3.13/site-packages
            test -f /opt/him/runtime/lib/python3.13/site-packages/torch/__init__.py
            test -f /opt/him/runtime/runtime-identity.json
            test -x /usr/local/bin/uv
            test -f /opt/him/validation/build-lineage.json
          '
          docker run --rm --entrypoint /opt/him/runtime/bin/python "$IMAGE:$CONTENT_TAG" \
            -c 'import json; d=json.load(open("/opt/him/runtime/runtime-identity.json")); assert d["runtimeImageDefinitionDigest"] == "337db7b29475d7830fc824fd30638c005edd90dd0a56bc3e1fbfa74596b0508d"; assert d["buildContextDigest"] == "8b74ce98c234ee4918db58178f14074b601e85f581a2866e07635e4407b48f9a"'

      - name: Authenticate to GHCR with repository token
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '%s' '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io \
            --username '${{ github.actor }}' --password-stdin

      - name: Check immutable content tag collision
        id: collision
        shell: bash
        run: |
          set -Eeuo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CONTENT_TAG" \
              > "$RUNNER_TEMP/tag-inspect.txt" 2> "$RUNNER_TEMP/tag-inspect.err"; then
            registry_digest=$(awk '$1 == "Digest:" { print $2; exit }' "$RUNNER_TEMP/tag-inspect.txt")
            test -n "$registry_digest"
            local_digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/build-metadata.json")
            if [ "$registry_digest" != "$local_digest" ]; then
              echo 'content tag already points to a different digest' >&2
              exit 78
            fi
            echo 'state=PRESENT_SAME_DIGEST' >> "$GITHUB_OUTPUT"
          else
            if ! grep -qiE 'no such manifest|manifest unknown|not found' "$RUNNER_TEMP/tag-inspect.err"; then
              cat "$RUNNER_TEMP/tag-inspect.err" >&2
              exit 78
            fi
            echo 'state=ABSENT' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish only the corrected content tag
        if: steps.collision.outputs.state == 'ABSENT'
        shell: bash
        run: docker push "$IMAGE:$CONTENT_TAG"

      - name: Read back registry digest and validate immutable repull
        shell: bash
        run: |
          set -Eeuo pipefail
          registry_digest=$(docker buildx imagetools inspect "$IMAGE:$CONTENT_TAG" \
            | awk '$1 == "Digest:" { print $2; exit }')
          test -n "$registry_digest"
          local_digest=$(jq -r '."containerimage.digest" // empty' "$RUNNER_TEMP/build-metadata.json")
          test "$registry_digest" = "$local_digest"
          test "$registry_digest" != "sha256:0bf7b043bdb8b7b17584e29308c701e7162161a694193f33fe3145e325f668f7"
          immutable_ref="$IMAGE@$registry_digest"
          docker pull "$immutable_ref"
          python_version=$(docker run --rm --entrypoint /opt/him/runtime/bin/python "$immutable_ref" --version)
          test "$python_version" = "Python $EXPECTED_PYTHON_VERSION"
          torch_info=$(docker run --rm --entrypoint /opt/him/runtime/bin/python "$immutable_ref" \
            -c 'import torch; print(torch.__version__); print(torch.version.cuda)')
          test "$torch_info" = $'2.14.0+cu130\n13.0'
          docker run --rm --entrypoint /opt/him/runtime/bin/python "$immutable_ref" \
            /opt/him/validation/him_runtime_validation_v1.py --mode build
          docker run --rm --entrypoint /opt/him/runtime/bin/python "$immutable_ref" \
            -c 'import json; d=json.load(open("/opt/him/runtime/runtime-identity.json")); assert d["runtimeImageDefinitionDigest"] == "337db7b29475d7830fc824fd30638c005edd90dd0a56bc3e1fbfa74596b0508d"; assert d["buildContextDigest"] == "8b74ce98c234ee4918db58178f14074b601e85f581a2866e07635e4407b48f9a"'
          printf 'CORRECTED_IMMUTABLE_REFERENCE=%s\n' "$immutable_ref"
          printf 'NEW_REGISTRY_OCI_DIGEST=%s\n' "$registry_digest"

      - name: Remove GHCR credentials from runner
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
